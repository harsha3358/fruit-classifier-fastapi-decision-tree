<!DOCTYPE html>
<html>
<head>
    <title>Fruit Classifier</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<div class="card">
    <h2>🍎🍊 Fruit Classifier</h2>
    <p>Decision Tree Orchard</p>

    <label>Weight</label>
    <input type="number" id="weight" value="165">

    <label>Color</label>
    <select id="color">
        <option>Red</option>
        <option>Green</option>
        <option>Orange</option>
    </select>

    <label>Texture</label>
    <select id="texture">
        <option>Smooth</option>
        <option>Rough</option>
    </select>

    <button onclick="predict()">Predict</button>
    <div class="result" id="result"></div>
</div>

<script type="module" src="/static/app.js"></script>
</body>
</html>
